[package]
name = "saeugling"
version = "2.5.0"
edition = "2021"
description = "Jinx: local continuously learning graph with an authenticated encrypted developer vault"

[dependencies]
anyhow = "1"
argon2 = { version = "0.5.3", features = ["zeroize"] }
chacha20poly1305 = "0.10.1"
flate2 = "1"
hmac = "0.12"
fs2 = "0.4"
json-patch = "4"
rand = "0.8"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
totp-rs = { version = "5.7", features = ["gen_secret", "otpauth", "zeroize"] }
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
